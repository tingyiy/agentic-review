[project]
name = "agentic-review"
version = "0.1.0"
description = "An agentic code reviewer that reads the repository, not just the diff."
readme = "README.md"
# What CI tests and what the reviewer runs on. A floor nothing verifies is a claim.
requires-python = ">=3.12"
license = { file = "LICENSE" }
# No runtime dependencies, deliberately. Everything talks HTTP through urllib
# and shells out to git — a reviewer that is a blocking check on every PR should
# not be able to break because a transitive dependency moved.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]  # pyyaml: the workflow-template tests read the YAML

[project.scripts]
agentic-review = "agentic_review.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentic_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
